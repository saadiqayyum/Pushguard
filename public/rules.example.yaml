# Pushguard rule format, by example.
#
# This is NOT the rule set. Pushguard ships a catalog of rules in
# lib/rules/catalog/, grouped into packs, and every account is evaluated against
# it without anything being written to a database. This file documents the
# format so you can write your own, and is what `npm run validate:rules` checks.
#
# A rule is when (conditions) plus then (an alert at its severity, and optional
# responses). Every field except id and severity is optional, but a rule needs
# at least one condition: paths, all_of, when, added_lines, commit_message,
# unicode_risk, any_of, or advanced.
#
# AI rules are a separate kind and are not written here: they carry a prompt
# rather than a pattern, and live in the dashboard. See AI_REVIEW.md, and
# lib/rules/ai-examples.ts for ready-made ones.
# All fields on a rule AND together; rules evaluate independently (OR).
# Globs: picomatch syntax. Regex: JS syntax, max 500 chars, and checked for
# catastrophic backtracking when saved.
# Severity -> action: critical/high = issue + team mention (emails),
# medium = issue, low = issue for digest triage.

# Pull requests. Every rule runs on pushes and on pull requests unless `on`
# narrows it. A pull request is evaluated as a whole, base...head, every time
# it changes; a commit the push already flagged attaches to that alert instead
# of filing again. The pull request gets a comment either way. `branches`
# matches the base.
- id: example-pull-request
  description: Workflow changes proposed against a release branch
  severity: high
  on: [pull_request]
  branches: [main, "release/*"]
  paths: [".github/workflows/**"]
  when:
    pr_draft: false         # skip drafts
    # pr_opened: true       # only when first opened, not on every push to it

# Push conditions. None of these can be answered by a scan, which reads
# committed code and knows nothing about the push that delivered it.
- id: example-push-conditions
  description: Everything the push event itself can be asked about
  severity: critical
  branches: [main, "release/*"]
  when:
    forced: true            # history was rewritten
    # sender_first_push: true   # this account has never pushed here
    # branch_created: true
    # branch_deleted: true
    # author_mismatch: true     # commit claims an author that is not the pusher
    # unreviewed: true          # no pull request contains this commit
    # hour_utc: { not_between: [4, 18] }

# File conditions. `repos` binds a rule to one organisation or repository.
- id: example-file-conditions
  description: Which files changed, and how
  severity: high
  repos: ["acme/*"]
  paths: [".github/workflows/**", "**/*.ts"]
  exclude_paths: ["**/*.test.ts"]
  change_type: [added, modified]   # or [removed]

# all_of: each group must be hit by a file in the SAME push. Either area alone
# is routine; together they are somebody widening what they can merge and what
# runs with your secrets.
- id: example-all-of
  description: Two areas changed in one push
  severity: critical
  all_of:
    - [CODEOWNERS, .github/CODEOWNERS]
    - [".github/workflows/**"]

# Content conditions. `added_lines` needs a diff, `commit_message` does not.
- id: example-content-conditions
  description: What the change actually says
  severity: critical
  paths: ["**/package.json"]
  added_lines: '"(pre|post)install"\s*:'
  # commit_message: '^Merge pull request #\d+'
  # unicode_risk: controls      # bidi overrides, invisible characters
  # unicode_risk: confusables   # the above plus homoglyphs

# Pattern lists. added_lines and commit_message take one regex or a list; each
# entry matches on its own (OR). Prefer a list over one long alternation.
- id: example-pattern-list
  description: Install hooks added in a commit that skips CI
  severity: high
  paths: ["**/package.json"]
  added_lines:
    - '"preinstall"\s*:'
    - '"postinstall"\s*:'
  commit_message: ['\bskip[- ]ci\b', '\[no ci\]']

# any_of: several condition groups, any one of which fires the rule. Fields
# inside a group AND together, exactly like top-level fields. Top-level
# conditions, if any, count as one more group. At most 10 groups.
- id: example-any-of
  description: A workflow change or a force push, on main
  severity: critical
  branches: [main]          # scope (repos, branches, on) applies to every group
  any_of:
    - paths: [".github/workflows/**"]
      change_type: [added, modified]
    - when: { forced: true }

# advanced: conditions the pattern fields cannot express, ANDed with them.
# A tree of all / any / not over leaves: facts (behaviour the code index saw,
# optionally across commits with `within`), path (an entry point reaching a
# sink), indicator (a threat-intel hit), context (the same fields as `when`),
# files, lines, and rule (another rule fired on this push). Pushes only: pull
# requests and scans skip a rule that has advanced conditions.
# responses: what happens besides the alert. investigate asks the AI
# investigator to focus (a fixed focus id), detonate runs the push in the
# sandbox (add the check phase and a published check by id), meta_alert alerts
# outside GitHub, snapshot_tags records every tag's commit. Responses run on pushes.
- id: example-advanced
  description: Install hook added, then a secret sent out within 30 days
  severity: critical
  paths: ["**/package.json", "**/*.js"]
  advanced:
    within: { days: 30 }
    when:
      all:
        - facts: { kinds: [install_hook] }
        - facts: { kinds: [secret_read, network], same_file: true }
        - not: { context: { forced: true } }
  responses:
    - investigate: { focus: install-hook-exfil }
    - detonate: { phases: [install, execute] }
    - meta_alert: true

# enabled: false ships a rule switched off. Useful for one that is right for
# some teams and noise for others.
- id: example-disabled
  description: Present but not firing until somebody turns it on
  severity: low
  enabled: false
  added_lines: "TODO|FIXME"

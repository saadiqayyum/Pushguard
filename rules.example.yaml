# Pushguard rules, spec by example.
# Every field except id and severity is optional, but a rule must have at
# least one condition (paths, when, added_lines, or ai).
# All fields on a rule AND together; rules evaluate independently (OR).
# Globs: picomatch syntax. Regex: JS syntax, max 500 chars.
# Severity -> action: critical/high = issue + team mention (emails),
# medium = issue, low = issue for digest triage.

# The original attack: force push by a compromised account.
- id: force-push
  description: Any force push to any branch
  severity: critical
  when:
    forced: true

# Code that executes on a teammate's machine after pull + install.
- id: install-hook-added
  description: npm lifecycle script added or changed
  severity: critical
  paths: ["**/package.json"]
  added_lines: '"(pre|post)install"|"prepare"\s*:'

# CI is code execution with repo secrets.
- id: workflow-changed
  description: GitHub Actions workflow created or modified
  severity: high
  paths: [".github/workflows/**"]
  change_type: [added, modified]

# Deleting protections is the step before the attack.
- id: protection-removed
  description: Workflow, CODEOWNERS, or hook config deleted
  severity: critical
  paths: [".github/workflows/**", "CODEOWNERS", ".github/CODEOWNERS", ".husky/**"]
  change_type: [removed]

# Editor-trust vectors: runs when a teammate opens the project.
- id: editor-autorun-changed
  description: VS Code tasks or settings modified
  severity: high
  paths: [".vscode/tasks.json", ".vscode/settings.json"]

- id: env-file-committed
  description: Dotenv file pushed to the repo
  severity: critical
  paths: ["**/.env", "**/.env.*"]
  exclude_paths: ["**/.env.example", "**/.env.sample"]
  change_type: [added, modified]

- id: obfuscated-payload
  description: Long base64 blob or dynamic code execution added
  severity: high
  added_lines: 'eval\(|new Function\(|child_process|[A-Za-z0-9+/]{200,}={0,2}'
  paths: ["**/*.js", "**/*.ts", "**/*.mjs", "**/*.cjs"]
  # `ai` runs only after the regex above has already matched, and only on the
  # push path. It needs a diff, so a scan drops it. The verdict is advisory:
  # it annotates the ticket and can never stop one being filed.
  ai: >-
    Is this obfuscated or dynamically executed code a deliberate attempt to hide behaviour, or an ordinary build artifact such as a minified bundle, a source map, or a vendored dependency? Say what the code actually does if you can tell.

# Scoped rule: one team, one folder, AI review on top.
- id: payments-critical-path
  description: Changes to charge logic get an AI review
  severity: high
  repos: ["acme/payments-api", "acme/billing-*"]
  branches: ["main", "release/*"]
  paths: ["src/charges/**"]
  ai: >
    Does this diff alter payment amounts, currency handling, destination
    accounts, or disable validation? Answer with a risk level and one
    sentence of reasoning.

# Watch rule: a single file under repeated attack. Costs zero API calls.
- id: watch-session-auth
  description: Any touch of the session auth module
  severity: critical
  repos: ["acme/api"]
  paths: ["src/auth/session.ts"]

# Push-behaviour rules. These ask about the act of pushing rather than about the
# code, which is the one thing a code scanner cannot see.

# Not suspicious alone, context for everything else in the feed. Answered from
# stored history, so it never fires in a scan.
- id: first-push-by-account
  description: An account pushed to this repository for the first time
  severity: medium
  when:
    sender_first_push: true

# `all_of` groups must EACH be matched by at least one changed file in the SAME
# push. Editing CI is routine. Editing CI in the push that also changes who
# reviews it is the shape of removing the person who would have noticed.
- id: reviewers-and-ci-in-one-push
  description: One push changed both the review rules and the CI that runs with your secrets
  severity: critical
  all_of:
    - ["CODEOWNERS", ".github/CODEOWNERS", "docs/CODEOWNERS", ".github/**/CODEOWNERS"]
    - [".github/workflows/**"]

- id: branch-deleted
  description: Branch deleted on a protected-pattern name
  severity: medium
  branches: ["main", "release/*"]
  when:
    branch_deleted: true

- id: off-hours-push
  description: Push outside 04:00-18:00 UTC working window
  severity: low
  branches: ["main"]
  when:
    hour_utc:
      not_between: [4, 18]
